<!doctype html>
<!--
  Model pipeline: textured FBX source -> game-ready GLB + livery textures.

  The sources are single merged meshes, so parts are recovered from geometry:
  the mesh is welded by position and split into connected shells, and each
  shell is classified by shape and placement (wheels are round and low, wings
  are thin plates, glass sits high, tiny bits are trim). Wheels become their
  own nodes with pivots at the axle so they can spin. Everything is
  normalised: nose to +Z, floor at y=0, centred, scaled to real length. UVs
  ride through untouched.

  Textures: base colour and normal come embedded in the FBX; roughness and
  metallic sit beside it. They are resampled to shippable sizes — 1024 for
  base and normal, and roughness (G) + metalness (B) packed into one 512 map
  the way glTF does it.

  Driven headlessly by tools/convert-models.mjs; results land in window.__glb
  (base64 GLBs), window.__tex (data-URL textures), window.__shots (preview
  renders), window.__meta.
-->
<meta charset="utf-8">
<canvas id="c" width="900" height="600"></canvas>
<pre id="out">working…</pre>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<script type="module">
  import * as THREE from 'three';
  import { FBXLoader } from '../vendor/jsm/loaders/FBXLoader.js';
  import { GLTFLoader } from '../vendor/jsm/loaders/GLTFLoader.js';
  import { GLTFExporter } from '../vendor/jsm/exporters/GLTFExporter.js';
  import * as BGU from '../vendor/jsm/utils/BufferGeometryUtils.js';
  import { RoomEnvironment } from '../vendor/jsm/environments/RoomEnvironment.js';

  // Real-world lengths (m). Colliders and camera offsets derive from these.
  const VEHICLES = {
    formula: { file: 'formula_tex.fbx', length: 5.0 },
    stock:   { file: 'stock_tex.fbx',   length: 5.2 },
    rally:   { file: 'rally_tex.fbx',   length: 4.4 },
    baja:    { file: 'baja_tex.fbx',    length: 5.2 },
    moto:    { file: 'moto_tex.fbx',    length: 2.2, wheels: 2 },
  };

  // Resample an image to size and encode. JPEG for everything: the recolour
  // keys on hue, which survives chroma subsampling at this quality.
  function bake(image, size, quality = 0.9) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(image, 0, 0, size, size);
    return c.toDataURL('image/jpeg', quality);
  }
  // Roughness -> G, metalness -> B (glTF metallicRoughness packing).
  function packRM(rough, metal, size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const read = (img) => { const t = document.createElement('canvas'); t.width = t.height = size; const tg = t.getContext('2d'); tg.drawImage(img, 0, 0, size, size); return tg.getImageData(0, 0, size, size).data; };
    const r = read(rough), m = read(metal);
    const out = g.createImageData(size, size);
    for (let i = 0; i < out.data.length; i += 4) { out.data[i] = 255; out.data[i + 1] = r[i]; out.data[i + 2] = m[i]; out.data[i + 3] = 255; }
    g.putImageData(out, 0, 0);
    return c.toDataURL('image/jpeg', 0.85);
  }
  const loadImage = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });

  // Connected shells of a non-indexed triangle soup, by position only.
  function splitShells(geo) {
    const bare = new THREE.BufferGeometry();
    bare.setAttribute('position', geo.attributes.position.clone());
    const welded = BGU.mergeVertices(bare, 1e-4);
    const map = welded.index.array; // original vertex -> welded vertex
    const nV = welded.attributes.position.count;
    const parent = new Int32Array(nV);
    for (let i = 0; i < nV; i++) parent[i] = i;
    const find = (a) => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
    const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[a] = b; };
    const triCount = geo.attributes.position.count / 3;
    for (let t = 0; t < triCount; t++) { union(map[3 * t], map[3 * t + 1]); union(map[3 * t + 1], map[3 * t + 2]); }
    const shells = new Map();
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let t = 0; t < triCount; t++) {
      const r = find(map[3 * t]);
      let s = shells.get(r);
      if (!s) { s = { tris: [], box: new THREE.Box3() }; shells.set(r, s); }
      s.tris.push(t);
      for (let k = 0; k < 3; k++) s.box.expandByPoint(v.fromBufferAttribute(pos, 3 * t + k));
    }
    return [...shells.values()].map((s) => ({
      tris: s.tris, box: s.box,
      size: s.box.getSize(new THREE.Vector3()),
      center: s.box.getCenter(new THREE.Vector3()),
    })).sort((a, b) => b.tris.length - a.tris.length);
  }

  // Gather the triangles of several shells into one geometry (indexed).
  function gather(geo, shellList, offset) {
    const pos = geo.attributes.position.array, nor = geo.attributes.normal.array;
    const uv = geo.attributes.uv ? geo.attributes.uv.array : null;
    const triN = shellList.reduce((a, s) => a + s.tris.length, 0);
    const p = new Float32Array(triN * 9), q = new Float32Array(triN * 9);
    const u = uv ? new Float32Array(triN * 6) : null;
    let w = 0, wu = 0;
    for (const s of shellList) for (const t of s.tris) {
      for (let k = 0; k < 9; k++) {
        p[w + k] = pos[9 * t + k] - (offset ? offset.getComponent(k % 3) : 0);
        q[w + k] = nor[9 * t + k];
      }
      if (uv) for (let k = 0; k < 6; k++) u[wu + k] = uv[6 * t + k];
      w += 9; wu += 6;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(q, 3));
    if (u) g.setAttribute('uv', new THREE.BufferAttribute(u, 2));
    return BGU.mergeVertices(g, 1e-4);
  }

  function classify(shells, model, wheelCount) {
    const L = model.z, H = model.y;
    const roles = new Map();
    const isRound = (s) => {
      const d = [s.size.x, s.size.y, s.size.z].sort((a, b) => a - b);
      return d[1] > 0 && d[2] / d[1] < 1.25 && d[0] / d[1] < 0.7;
    };
    // Wheels: round in the length/height plane, low, big enough to matter.
    // Width is allowed up to 85% of the diameter — F1 rears and truck tyres
    // are fat, and were being taken for body panels.
    const wheelish = shells.filter((s) =>
      s.tris.length >= 60 && Math.abs(s.size.y - s.size.z) / Math.max(s.size.y, s.size.z) < 0.25 &&
      s.size.x < s.size.y * 0.85 && s.size.x > s.size.y * 0.15 &&
      s.center.y < H * 0.45 && s.size.y > L * 0.1);
    wheelish.sort((a, b) => b.size.y - a.size.y);
    const wheels = wheelish.slice(0, wheelCount);
    wheels.forEach((s) => roles.set(s, 'wheel'));

    // Bikes: the paddock stand is everything that reaches the ground behind
    // the rear axle (the base and its uprights). It becomes its own node,
    // hinged at the axle, so it can swing up on the start.
    let standPivot = null;
    if (wheelCount === 2 && wheels.length === 2) {
      const rear = wheels.reduce((a, b) => (a.center.z < b.center.z ? a : b));
      standPivot = rear.box.getCenter(new THREE.Vector3());
      shells.forEach((s) => {
        if (roles.has(s)) return;
        if (s.box.min.y < 0.12 * H && s.center.z < standPivot.z) roles.set(s, 'stand');
      });
    }

    // Stock: the model's windscreen centre divider — a thin upright shell in
    // the middle of the glazing — is dropped; it sat right in the driver's
    // eye line.
    if (model.drop) shells.forEach((s) => { if (!roles.has(s) && model.drop(s)) roles.set(s, 'drop'); });

    shells.forEach((s, i) => {
      if (roles.has(s)) return;
      const d = [s.size.x, s.size.y, s.size.z];
      const mx = Math.max(...d), mn = Math.min(...d);
      if (i === 0) roles.set(s, 'primary');                                    // the body
      else if (s.tris.length < 30) roles.set(s, 'dark');                        // bolts, lamps, antennae
      else if (wheelCount === 2 && isRound(s) && s.center.y > H * 0.6) roles.set(s, 'secondary'); // helmet-like (bikes only; a truck's spare sits high too)
      else if (isRound(s)) roles.set(s, 'dark');                                // spare tyres, drums
      else if (mn / mx < 0.18) roles.set(s, 'secondary');                       // wings, spoilers, plates
      else if (s.center.y > H * 0.62) roles.set(s, 'glass');                    // cabin glazing
      else roles.set(s, 'primary');
    });
    return { roles, wheels, standPivot };
  }

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2b2f37);
  scene.environment = env;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(3, 6, 4); scene.add(sun);
  const cam = new THREE.PerspectiveCamera(38, 1.5, 0.05, 100);
  const PALETTE = {
    primary: new THREE.MeshStandardMaterial({ color: 0xe10600, metalness: 0.3, roughness: 0.35 }),
    secondary: new THREE.MeshStandardMaterial({ color: 0xf2f2f2, metalness: 0.3, roughness: 0.4 }),
    glass: new THREE.MeshStandardMaterial({ color: 0x101820, metalness: 0.6, roughness: 0.15 }),
    dark: new THREE.MeshStandardMaterial({ color: 0x24272d, metalness: 0.2, roughness: 0.7 }),
    wheel: new THREE.MeshStandardMaterial({ color: 0x15171a, metalness: 0.1, roughness: 0.85 }),
  };

  const out = {}, shots = {}, meta = {}, tex = {};
  for (const [vehicle, cfg] of Object.entries(VEHICLES)) {
    const isGlb = cfg.file.endsWith('.glb') || cfg.file.endsWith('.gltf');
    // Embedded textures decode after the mesh resolves; the manager's onLoad
    // fires once everything, images included, is in.
    const manager = new THREE.LoadingManager();
    const allIn = new Promise((res) => { manager.onLoad = res; });
    const loaded = isGlb
      ? (await new GLTFLoader(manager).loadAsync(`../assets/fbx-src/${cfg.file}`)).scene
      : await new FBXLoader(manager).loadAsync(`../assets/fbx-src/${cfg.file}`);
    await allIn;
    // Textures: base colour + normal are embedded in the FBX material.
    let srcMat = null;
    loaded.traverse((o) => { if (o.isMesh && !srcMat) srcMat = Array.isArray(o.material) ? o.material[0] : o.material; });
    if (srcMat?.map?.image) {
      const rough = await loadImage(`../assets/fbx-src/tex/${vehicle}_roughness.png`);
      const metal = await loadImage(`../assets/fbx-src/tex/${vehicle}_metallic.png`);
      tex[vehicle] = {
        base: bake(srcMat.map.image, 1024, 0.9),
        normal: srcMat.normalMap?.image ? bake(srcMat.normalMap.image, 1024, 0.92) : null,
        rm: packRM(rough, metal, 512),
      };
    }

    // Merge every mesh into one soup (a re-export may arrive as several objects).
    const pieces = [];
    loaded.updateWorldMatrix(true, true);
    loaded.traverse((o) => {
      if (!o.isMesh) return;
      let g = o.geometry.clone();
      if (g.index) g = g.toNonIndexed();
      for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name)) g.deleteAttribute(name);
      if (!g.attributes.normal) g.computeVertexNormals();
      g.applyMatrix4(o.matrixWorld);
      pieces.push(g);
    });
    const everyUV = pieces.every((g) => g.attributes.uv);
    if (!everyUV) pieces.forEach((g) => g.deleteAttribute('uv'));
    const geo = pieces.length === 1 ? pieces[0] : BGU.mergeGeometries(pieces, false);
    // Nose to +Z. FBX sources here run along -X; a glTF is already Y-up with
    // +Z... conventions vary, so the per-vehicle `nose` says which axis.
    if ((cfg.nose || '-x') === '-x') geo.rotateY(Math.PI / 2);
    else if (cfg.nose === '+x') geo.rotateY(-Math.PI / 2);
    else if (cfg.nose === '-z') geo.rotateY(Math.PI);
    let box = new THREE.Box3().setFromBufferAttribute(geo.attributes.position);
    let size = box.getSize(new THREE.Vector3());
    geo.scale(cfg.length / size.z, cfg.length / size.z, cfg.length / size.z);
    box = new THREE.Box3().setFromBufferAttribute(geo.attributes.position);
    size = box.getSize(new THREE.Vector3());
    const c = box.getCenter(new THREE.Vector3());
    geo.translate(-c.x, -box.min.y, -c.z);
    geo.computeVertexNormals(); // scale/rotate are uniform, but be safe

    const shells = splitShells(geo);
    if (vehicle === 'stock') size.drop = (s) => s.size.x < 0.1 && Math.abs(s.center.x) < 0.06 && s.center.y > 0.9 && s.center.y < 1.5 && s.center.z > 0.25 && s.center.z < 1.1;
    const { roles, wheels, standPivot } = classify(shells, size, cfg.wheels || 4);

    const root = new THREE.Group();
    root.name = vehicle;
    const byRole = {};
    for (const s of shells) {
      const r = roles.get(s);
      if (r === 'wheel' || r === 'drop') continue;
      (byRole[r] = byRole[r] || []).push(s);
    }
    const partTris = {};
    for (const [r, list] of Object.entries(byRole)) {
      // The stand is built around its hinge so it can rotate in place.
      const pivot = r === 'stand' ? standPivot : null;
      const m = new THREE.Mesh(gather(geo, list, pivot || undefined), PALETTE[r] || PALETTE.dark);
      m.name = r;
      if (pivot) m.position.copy(pivot);
      root.add(m);
      partTris[r] = list.reduce((a, s) => a + s.tris.length, 0);
    }
    let wheelRadius = 0;
    wheels.forEach((s, i) => {
      const centre = s.box.getCenter(new THREE.Vector3());
      const m = new THREE.Mesh(gather(geo, [s], centre), PALETTE.wheel);
      m.name = `wheel_${i}`;
      m.position.copy(centre);
      root.add(m);
      wheelRadius = Math.max(wheelRadius, s.size.y / 2);
    });
    root.userData = {
      vehicle, length: +size.z.toFixed(3), width: +size.x.toFixed(3), height: +size.y.toFixed(3),
      wheelRadius: +wheelRadius.toFixed(3), wheels: wheels.length,
      hasUV: !!geo.attributes.uv, // a livery atlas can only be applied when this is true
    };
    meta[vehicle] = { ...root.userData, shells: shells.length, parts: partTris,
      wheelCentres: wheels.map((s) => s.box.getCenter(new THREE.Vector3()).toArray().map((v) => +v.toFixed(2))) };
    // Every shell with its role, for inspecting the classification.
    (window.__shellDump = window.__shellDump || {})[vehicle] = shells.map((s) => ({
      role: roles.get(s), tris: s.tris.length,
      min: s.box.min.toArray().map((v) => +v.toFixed(2)), max: s.box.max.toArray().map((v) => +v.toFixed(2)) }));

    // Preview renders: textured, with a team recolour where an atlas exists.
    if (window.__prev) scene.remove(window.__prev);
    window.__prev = root;
    scene.add(root);
    if (tex[vehicle]) {
      const { liveryMaterial, loadLiveries, refreshAccents } = await import('../src/three/models.js');
      window.__BR_LIVERIES__ = { [vehicle]: { base: tex[vehicle].base, normal: tex[vehicle].normal, rm: tex[vehicle].rm } };
      await loadLiveries();
      const bodyGeos = root.children.filter((o) => o.isMesh && !/^wheel_/.test(o.name)).map((o) => o.geometry);
      meta[vehicle].accents = refreshAccents(vehicle, bodyGeos).map((h) => h < 0 ? null : Math.round(h * 360) + '°');
      // export the GLB with plain materials; the game assigns its own
      const m = liveryMaterial(vehicle, ['#2ecc40', '#ffd12a'], /* forPreview */ true);
      root.traverse((o) => { if (o.isMesh) { o.userData.exportMat = o.material; o.material = m; } });
    }
    const L = size.z;
    shots[vehicle] = {};
    for (const [k, p] of Object.entries({ threeq: [L * 1.1, L * 0.7, L * 1.3], rear: [L * 0.9, L * 0.6, -L * 1.3], side: [L * 1.9, L * 0.4, 0] })) {
      cam.position.set(...p); cam.lookAt(0, size.y * 0.4, 0); cam.updateProjectionMatrix();
      renderer.render(scene, cam);
      shots[vehicle][k] = renderer.domElement.toDataURL('image/png');
    }

    root.traverse((o) => { if (o.isMesh && o.userData.exportMat) { o.material = o.userData.exportMat; delete o.userData.exportMat; } });
    if (vehicle === 'moto') window.__motoRoot = root;
    const glb = await new GLTFExporter().parseAsync(root, { binary: true });
    const bytes = new Uint8Array(glb);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    out[vehicle] = btoa(bin);
  }

  // ---------------------------------------------------------------------------
  // Rider: a static A-pose figure with no skeleton, posed here into a racing
  // tuck. Vertices are assigned to body parts by height and lateral offset,
  // then rotated about the joints with smooth weights so limbs bend instead
  // of tearing — a five-bone skin baked once, free at runtime.
  // ---------------------------------------------------------------------------
  {
    const manager = new THREE.LoadingManager();
    const allIn = new Promise((res) => { manager.onLoad = res; });
    const loaded = await new FBXLoader(manager).loadAsync('../assets/fbx-src/rider_tex.fbx');
    await allIn;
    let src = null;
    loaded.updateWorldMatrix(true, true);
    loaded.traverse((o) => { if (o.isMesh && !src) src = o; });
    const srcMat = Array.isArray(src.material) ? src.material[0] : src.material;
    if (srcMat?.map?.image) {
      const rough = await loadImage('../assets/fbx-src/tex/rider_roughness.png');
      const metal = await loadImage('../assets/fbx-src/tex/rider_metallic.png');
      tex.rider = { base: bake(srcMat.map.image, 1024, 0.9), normal: srcMat.normalMap?.image ? bake(srcMat.normalMap.image, 1024, 0.92) : null, rm: packRM(rough, metal, 512) };
    }

    let geo = src.geometry.clone();
    if (geo.index) geo = geo.toNonIndexed();
    for (const name of Object.keys(geo.attributes)) if (!['position', 'normal', 'uv'].includes(name)) geo.deleteAttribute(name);
    geo.applyMatrix4(src.matrixWorld);
    // The figure already faces +Z (toes and hands lie forward of the shins
    // and shoulders), the same way as the vehicles.
    // Normalise: unit height, centred, feet at y=0.
    let box = new THREE.Box3().setFromBufferAttribute(geo.attributes.position);
    let size = box.getSize(new THREE.Vector3());
    geo.scale(1 / size.y, 1 / size.y, 1 / size.y);
    box = new THREE.Box3().setFromBufferAttribute(geo.attributes.position);
    const c = box.getCenter(new THREE.Vector3());
    geo.translate(-c.x, -box.min.y, -c.z);

    // Joints as fractions of standing height, and the pose angles (radians).
    // Rotations are right-handed about +X, so a hanging limb swings backward
    // under a positive angle and forward under a negative one.
    const J = { hip: 0.50, knee: 0.27, shoulder: 0.80, elbow: 0.64, neck: 0.87, legX: 0.06, shoulderX: 0.15, elbowX: 0.17 };
    // Two figures from the one mesh: the rider's racing tuck for the bikes,
    // and a seated driver for the cars — upright, thighs forward, feet at
    // the pedals, arms out to a wheel.
    const POSES = {
      rider: {
        lean: 0.85,     // torso onto the tank
        head: 0.55,     // head pitched back up to look down the road
        thigh: 1.35,    // thighs forward along the tank
        shin: 2.2,      // knees bent, boots back on the pegs
        splay: 0.09,    // knees out around the tank
        upper: 0.4,     // upper arms forward from the shoulder
        out: 0.6,       // elbows wide
        fore: 1.8,      // elbows bent so the hands come up to the grips
        yaw: 0.0,       // forearms swung inward to the grips
      },
      driver: {
        lean: 0.15, head: 0.05, thigh: 1.45, shin: 0.9, splay: 0.03,
        upper: 1.3, out: 0.12, fore: 0.3, yaw: 0.05,
      },
    };
    const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
    const rotAbout = (v, pivot, axis, angle) => { v.sub(pivot).applyAxisAngle(axis, angle).add(pivot); };
    const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
    const baseGeo = geo;
    const basePos = baseGeo.attributes.position; // original (A-pose) coordinates, for classifying parts
    const { liveryMaterial, loadLiveries, refreshAccents, placeRider } = await import('../src/three/models.js');
    if (tex.rider) { window.__BR_LIVERIES__ = { rider: tex.rider }; await loadLiveries(); }

    for (const [figure, A] of Object.entries(POSES)) {
    const geo = baseGeo.clone();
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    const head = new THREE.Vector3(); let headN = 0;
    const hands = new THREE.Vector3(); let handsN = 0;
    const handL = new THREE.Vector3(), handR = new THREE.Vector3(); let handLN = 0, handRN = 0;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const x0 = v.x, y0 = v.y;
      const isArm = y0 > 0.36 && y0 < 0.86 && Math.abs(x0) > 0.105;
      const isLeg = y0 < J.hip + 0.02 && !isArm;
      const side = Math.sign(x0) || 1;
      if (isLeg) {
        // shin first (about the knee), then the whole leg about the hip
        const wShin = 1 - smooth(J.knee - 0.03, J.knee + 0.03, y0);
        if (wShin > 0) rotAbout(v, new THREE.Vector3(side * J.legX, J.knee, 0), X, A.shin * wShin);
        const wThigh = 1 - smooth(J.hip - 0.03, J.hip + 0.02, y0);
        rotAbout(v, new THREE.Vector3(side * J.legX, J.hip, 0), X, -A.thigh * wThigh);
        v.x += side * A.splay * wThigh;
      } else {
        if (y0 > J.neck - 0.02) {
          const wHead = smooth(J.neck - 0.02, J.neck + 0.03, y0);
          rotAbout(v, new THREE.Vector3(0, J.neck, 0), X, -A.head * wHead);
        }
        if (isArm) {
          // Forearm about the elbow (bend, then swing inward), then the
          // upper arm about the shoulder (forward, then out to the side).
          const elbow = new THREE.Vector3(side * J.elbowX, J.elbow, 0);
          const shoulder = new THREE.Vector3(side * J.shoulderX, J.shoulder, 0);
          const wFore = 1 - smooth(J.elbow - 0.03, J.elbow + 0.03, y0);
          if (wFore > 0) {
            rotAbout(v, elbow, X, -A.fore * wFore);
            rotAbout(v, elbow, Y, -side * A.yaw * wFore);
          }
          const wArm = 1 - smooth(J.shoulder - 0.02, J.shoulder + 0.04, y0);
          rotAbout(v, shoulder, X, -A.upper * wArm);
          rotAbout(v, shoulder, Z, side * A.out * wArm);
        }
        // Everything above the hips leans into the tank. The arms hang from
        // the shoulders, so they lean fully whatever height they started at.
        const wTorso = isArm ? 1 : smooth(J.hip - 0.02, J.hip + 0.06, y0);
        rotAbout(v, new THREE.Vector3(0, J.hip, 0), X, A.lean * wTorso);
      }
      pos.setXYZ(i, v.x, v.y, v.z);
      if (y0 > 0.9) { head.add(v); headN++; }
      if (isArm && y0 < 0.45) {
        hands.x += Math.abs(v.x); hands.y += v.y; hands.z += v.z; handsN++;
        if (x0 > 0) { handL.add(v); handLN++; } else { handR.add(v); handRN++; }
      }
    }
    // Where the arm joints ended up, per side (the same rotations the arm
    // vertices got), so the driver's arms can be split off and re-aimed at
    // runtime from these pivots.
    const jointsFor = (side) => {
      const shoulder = new THREE.Vector3(side * J.shoulderX, J.shoulder, 0);
      const elbow = new THREE.Vector3(side * J.elbowX, J.elbow, 0);
      rotAbout(elbow, shoulder.clone(), X, -A.upper);
      rotAbout(elbow, shoulder.clone(), Z, side * A.out);
      for (const p of [shoulder, elbow]) rotAbout(p, new THREE.Vector3(0, J.hip, 0), X, A.lean);
      const hand = (side > 0 ? handL.clone().divideScalar(Math.max(1, handLN)) : handR.clone().divideScalar(Math.max(1, handRN)));
      for (const p of [shoulder, elbow, hand]) p.y -= J.hip;
      return { shoulder, elbow, hand };
    };
    // Hips at the origin: the seat point is where this lands.
    geo.translate(0, -J.hip, 0);
    head.divideScalar(Math.max(1, headN)).y -= J.hip;
    hands.divideScalar(Math.max(1, handsN)).y -= J.hip;
    geo.computeVertexNormals();
    const riderRoot = new THREE.Group();
    riderRoot.name = figure;
    let posed, riderMesh;
    const arms = {};
    if (true) {
      // Split the arms off as their own meshes — upper arm pivoted at the
      // shoulder, forearm (with the hand) a child of it pivoted at the elbow
      // — so the runtime can aim the hands at the wheel. Triangles are
      // assigned by where their vertices started in the A-pose.
      const lists = { body: [], arm_l: [], fore_l: [], arm_r: [], fore_r: [] };
      const triN = pos.count / 3;
      for (let t = 0; t < triN; t++) {
        let arm = 0, fore = 0, sideSum = 0;
        for (let k = 0; k < 3; k++) {
          const x0 = basePos.getX(3 * t + k), y0 = basePos.getY(3 * t + k);
          const isArm = y0 > 0.36 && y0 < 0.86 && Math.abs(x0) > 0.105;
          if (isArm) { arm++; sideSum += Math.sign(x0); if (y0 < J.elbow - 0.03) fore++; }
        }
        if (arm >= 2) {
          const side = sideSum > 0 ? 'l' : 'r';
          lists[(fore >= 2 ? 'fore_' : 'arm_') + side].push(t);
        } else lists.body.push(t);
      }
      const joints = { l: jointsFor(1), r: jointsFor(-1) };
      posed = gather(geo, [{ tris: lists.body }]);
      riderMesh = new THREE.Mesh(posed, PALETTE.primary);
      riderMesh.name = 'body';
      riderRoot.add(riderMesh);
      for (const side of ['l', 'r']) {
        const jt = joints[side];
        const upper = new THREE.Mesh(gather(geo, [{ tris: lists['arm_' + side] }], jt.shoulder), PALETTE.primary);
        upper.name = 'arm_' + side;
        upper.position.copy(jt.shoulder);
        const fore = new THREE.Mesh(gather(geo, [{ tris: lists['fore_' + side] }], jt.elbow), PALETTE.primary);
        fore.name = 'fore_' + side;
        fore.position.copy(jt.elbow).sub(jt.shoulder);
        upper.add(fore);
        riderRoot.add(upper);
        arms[side] = { shoulder: jt.shoulder.toArray().map((x) => +x.toFixed(3)), elbow: jt.elbow.toArray().map((x) => +x.toFixed(3)), hand: jt.hand.toArray().map((x) => +x.toFixed(3)) };
      }
    } else {
      posed = BGU.mergeVertices(geo, 1e-4);
      riderMesh = new THREE.Mesh(posed, PALETTE.primary);
      riderMesh.name = 'body';
      riderRoot.add(riderMesh);
    }
    const pb = new THREE.Box3().setFromObject(riderRoot);
    const ps = pb.getSize(new THREE.Vector3());
    riderRoot.userData = { vehicle: figure, length: +ps.z.toFixed(3), width: +ps.x.toFixed(3), height: +ps.y.toFixed(3), wheelRadius: 0, wheels: 0, hasUV: !!posed.attributes.uv,
      // in units of standing height: how far the hips sit above the feet, and
      // where the head and hands ended up relative to the hips
      hipHeight: J.hip,
      head: head.toArray().map((x) => +x.toFixed(3)), hands: hands.toArray().map((x) => +x.toFixed(3)),
      arms };
    meta[figure] = { ...riderRoot.userData };

    // Preview: the rider on the bike, in the game's own placement, with a
    // team recolour; the driver on his own.
    if (tex.rider) {
      if (figure === 'rider') meta.rider.accents = refreshAccents('rider', [posed]).map((h) => h < 0 ? null : Math.round(h * 360) + '°');
      const m = liveryMaterial('rider', ['#2ecc40', '#ffd12a']);
      riderRoot.traverse((o) => { if (o.isMesh) o.material = m; });
    }
    if (window.__prev) scene.remove(window.__prev);
    const combo = new THREE.Group();
    const bike = window.__motoRoot;
    if (figure === 'rider' && bike) combo.add(bike);
    const seated = riderRoot.clone();
    if (figure === 'rider') placeRider(seated, bike ? bike.userData : { height: 1.35, length: 2.2 });
    else { seated.scale.setScalar(1.72); seated.position.y = 0.5; }
    combo.add(seated);
    scene.add(combo);
    window.__prev = combo;
    shots[figure] = {};
    const L = 2.2;
    for (const [k, p] of Object.entries({ threeq: [L * 1.1, L * 0.7, L * 1.3], side: [L * 1.9, L * 0.45, 0], front: [0, L * 0.5, L * 2.0], rear: [0, L * 0.6, -L * 1.9] })) {
      cam.position.set(...p); cam.lookAt(0, 0.7, 0); cam.updateProjectionMatrix();
      renderer.render(scene, cam);
      shots[figure][k] = renderer.domElement.toDataURL('image/png');
    }
    riderRoot.traverse((o) => { if (o.isMesh) o.material = PALETTE.primary; });
    const glb = await new GLTFExporter().parseAsync(riderRoot, { binary: true });
    const bytes = new Uint8Array(glb);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    out[figure] = btoa(bin);
    }
  }

  document.getElementById('out').textContent = JSON.stringify(meta, null, 2);
  window.__meta = meta; window.__glb = out; window.__shots = shots; window.__tex = tex;
</script>
